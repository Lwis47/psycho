{% extends "base.html" %} {% block title %}Log in · E.H.H.{% endblock %} {%
block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to continue your path.</p>
    <form method="post">
      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          value="{{ email }}"
          required
          autofocus
          placeholder="jane.doe@example.com"
        />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="********"
        />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <div class="auth-foot">
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
      <span>New here? <a href="{{ url_for('signup') }}">Sign up</a></span>
    </div>
  </div>
</div>
{% endblock %}
