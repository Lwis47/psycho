{% extends "base.html" %}
{% block title %}Something went wrong · E.H.H.{% endblock %}
{% block content %}
<section class="error-page">
  <div class="error-code">500</div>
  <h1>Something broke on our end.</h1>
  <p>This wasn't your fault. Try again in a moment — if it keeps happening, let an administrator know.</p>
  <div class="hero-actions" style="justify-content:center;">
    <a class="btn btn-primary" href="{{ url_for('index') }}">Back to home</a>
  </div>
</section>
{% endblock %}
