<!doctype html>
{% extends "base.html" %} {% block title %}Sign up · E.H.H.{% endblock %} {%
block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-sub">We'll send a verification code to your email.</p>
    <form method="post" data-password-confirm>
      <div class="field">
        <label for="full_name">Full name</label>
        <input
          type="text"
          id="full_name"
          name="full_name"
          value="{{ full_name }}"
          placeholder="Jane Doe"
          autofocus
        />
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          value="{{ email }}"
          required
          placeholder="jane.doe@example.com"
        />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          required
          placeholder="********"
        />
        <div class="field-hint">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          minlength="8"
          required
          placeholder="********"
        />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>
    <div class="auth-foot">
      <span
        >Already have an account?
        <a href="{{ url_for('login') }}">Log in</a></span
      >
    </div>
  </div>
</div>
{% endblock %}
