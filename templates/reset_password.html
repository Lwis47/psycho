{% extends "base.html" %}
{% block title %}Reset password · E.H.H.{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Choose a new password</h1>
    <p class="auth-sub">Enter the code we emailed you and your new password.</p>
    <form method="post" data-password-confirm>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <div class="field code-input">
        <label for="code">Reset code</label>
        <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
      </div>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reset password</button>
    </form>
    <div class="auth-foot">
      <a href="{{ url_for('forgot_password') }}">Request a new code</a>
      <a href="{{ url_for('login') }}">Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}
