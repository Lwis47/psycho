{% extends "base.html" %}
{% block title %}Forgot password · E.H.H.{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="auth-sub">Enter your email and we'll send a reset code, if it's registered with E.H.H.</p>
    <form method="post">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send reset code</button>
    </form>
    <div class="auth-foot">
      <a href="{{ url_for('login') }}">Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}
