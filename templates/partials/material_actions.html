{% macro material_actions(m) %}
<div class="material-actions">
  <a class="btn btn-ghost btn-sm" href="{{ url_for('view_material', material_id=m.id) }}" target="_blank" rel="noopener">View</a>
  <a class="btn btn-ghost btn-sm" href="{{ url_for('download_material', material_id=m.id) }}">Download</a>

  <form method="post" action="{{ url_for('react_material', material_id=m.id) }}" class="reaction-form">
    <input type="hidden" name="reaction" value="like">
    <input type="hidden" name="next" value="{{ request.path }}">
    <button type="submit" class="reaction-btn {{ 'active-like' if m.user_reaction == 'like' else '' }}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 22V11 M2 13v7a2 2 0 0 0 2 2h12.7a2 2 0 0 0 2-1.6l1.3-7A2 2 0 0 0 18 11h-5l1-5.5a1.5 1.5 0 0 0-2.6-1.2L7 11H2Z"/></svg>
      {{ m.likes }}
    </button>
  </form>

  <form method="post" action="{{ url_for('react_material', material_id=m.id) }}" class="reaction-form">
    <input type="hidden" name="reaction" value="dislike">
    <input type="hidden" name="next" value="{{ request.path }}">
    <button type="submit" class="reaction-btn {{ 'active-dislike' if m.user_reaction == 'dislike' else '' }}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2v11 M22 11V4a2 2 0 0 0 -2-2H7.3a2 2 0 0 0 -2 1.6L4 10.6A2 2 0 0 0 6 13h5l-1 5.5a1.5 1.5 0 0 0 2.6 1.2L17 13h5Z"/></svg>
      {{ m.dislikes }}
    </button>
  </form>

  <a class="btn btn-ghost btn-sm" href="{{ url_for('material_detail', material_id=m.id) }}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:4px;"><path d="M21 11.5a8.4 8.4 0 0 1 -.9 3.8 8.5 8.5 0 0 1 -7.6 4.7 8.4 8.4 0 0 1 -3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1 -.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>Comments ({{ m.comment_count }})
  </a>
</div>
{% endmacro %}
